<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ambient Weather Signage</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Fonts: Zen Kaku Gothic New & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&family=Zen+Kaku+Gothic+New:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', 'Zen Kaku Gothic New', sans-serif;
      overflow: hidden;
      user-select: none;
      background-color: #0f172a;
      color: #f8fafc;
    }

    /* Ambient Canvas Background */
    #ambient-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      transition: opacity 1.5s ease;
    }

    /* UI Layer Glassmorphism Elements */
    .glass-panel {
      background: rgba(15, 23, 42, 0.35);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    }

    .glass-pill {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    /* Custom Scrollbar for mini calendar */
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }

    /* Subtle UI Hover & Control Fade */
    .control-trigger:hover .control-panel,
    .control-panel:hover {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .control-panel {
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Calendar Grid Styling */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    /* Fade-in Animation */
    .animate-fade-in {
      animation: fadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="w-screen h-screen relative flex flex-col justify-between p-8 md:p-14 selection:bg-white/20">

  <!-- Background Weather Canvas -->
  <canvas id="ambient-canvas"></canvas>

  <!-- Content Layer Overlay -->
  <div class="relative z-10 w-full h-full flex flex-col justify-between pointer-events-none">

    <!-- Top Bar: Location & Controls -->
    <div class="flex justify-between items-start w-full">
      
      <!-- Weather & Location Info -->
      <div class="glass-pill px-5 py-2.5 rounded-full flex items-center space-x-3 pointer-events-auto transition-all hover:bg-white/10 cursor-pointer" id="weather-badge" onclick="toggleControlModal()">
        <span id="weather-icon-wrapper" class="text-white/90">
          <i data-lucide="sun" class="w-5 h-5"></i>
        </span>
        <div class="flex flex-col">
          <div class="flex items-center space-x-2">
            <span id="location-name" class="text-xs tracking-wider uppercase font-medium text-white/70">東京</span>
            <span class="text-xs text-white/40">•</span>
            <span id="weather-temp" class="text-xs font-semibold text-white/90">--°C</span>
          </div>
          <span id="weather-desc" class="text-[11px] text-white/60 font-light">晴れ</span>
        </div>
      </div>

      <!-- Quick Action Controls (Hover/Tap visible) -->
      <div class="control-trigger relative pointer-events-auto">
        <button id="menu-btn" class="glass-pill p-3 rounded-full text-white/70 hover:text-white transition-colors focus:outline-none" title="設定・切り替え">
          <i data-lucide="sliders" class="w-5 h-5"></i>
        </button>

        <!-- Dropdown / Control Panel -->
        <div class="control-panel absolute right-0 mt-3 w-64 glass-panel rounded-2xl p-4 flex flex-col space-y-3 text-sm text-white/90">
          <div class="text-xs text-white/50 uppercase tracking-wider font-semibold mb-1">天気を手動切り替え</div>
          <div class="grid grid-cols-3 gap-1.5" id="weather-selector">
            <button onclick="setWeather('clear')" class="weather-btn p-2 rounded-lg bg-white/5 hover:bg-white/15 flex flex-col items-center justify-center space-y-1 transition text-xs">
              <i data-lucide="sun" class="w-4 h-4 text-amber-300"></i>
              <span>快晴</span>
            </button>
            <button onclick="setWeather('clouds')" class="weather-btn p-2 rounded-lg bg-white/5 hover:bg-white/15 flex flex-col items-center justify-center space-y-1 transition text-xs">
              <i data-lucide="cloud" class="w-4 h-4 text-slate-300"></i>
              <span>曇り</span>
            </button>
            <button onclick="setWeather('rain')" class="weather-btn p-2 rounded-lg bg-white/5 hover:bg-white/15 flex flex-col items-center justify-center space-y-1 transition text-xs">
              <i data-lucide="cloud-rain" class="w-4 h-4 text-blue-300"></i>
              <span>雨</span>
            </button>
            <button onclick="setWeather('snow')" class="weather-btn p-2 rounded-lg bg-white/5 hover:bg-white/15 flex flex-col items-center justify-center space-y-1 transition text-xs">
              <i data-lucide="snowflake" class="w-4 h-4 text-indigo-200"></i>
              <span>雪</span>
            </button>
            <button onclick="setWeather('thunderstorm')" class="weather-btn p-2 rounded-lg bg-white/5 hover:bg-white/15 flex flex-col items-center justify-center space-y-1 transition text-xs">
              <i data-lucide="cloud-lightning" class="w-4 h-4 text-yellow-400"></i>
              <span>雷雨</span>
            </button>
            <button onclick="fetchCurrentLocationWeather()" class="weather-btn p-2 rounded-lg bg-white/5 hover:bg-white/15 flex flex-col items-center justify-center space-y-1 transition text-xs" title="現在地の自動取得">
              <i data-lucide="locate" class="w-4 h-4 text-emerald-300"></i>
              <span>現在地</span>
            </button>
          </div>

          <hr class="border-white/10 my-1">

          <div class="flex items-center justify-between">
            <span class="text-xs text-white/70">全画面表示</span>
            <button onclick="toggleFullscreen()" class="glass-pill px-3 py-1 rounded-md text-xs hover:bg-white/20 transition">
              <i data-lucide="maximize" class="w-3.5 h-3.5 inline mr-1"></i>切替
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Center/Main Clock Container -->
    <div class="my-auto flex flex-col items-center justify-center text-center py-6 animate-fade-in">
      <!-- Digital Time -->
      <div id="clock-time" class="text-7xl sm:text-8xl md:text-9xl lg:text-[11rem] font-extralight tracking-tight text-white/95 leading-none drop-shadow-sm">
        00:00<span id="clock-seconds" class="text-2xl sm:text-3xl md:text-4xl font-light text-white/40 ml-2 tracking-normal">00</span>
      </div>
      
      <!-- Date Display -->
      <div class="mt-4 sm:mt-6 flex items-center space-x-3 text-lg sm:text-xl md:text-2xl text-white/80 font-light tracking-widest">
        <span id="date-full">----年--月--日</span>
        <span id="date-day" class="px-2.5 py-0.5 rounded-full text-xs font-normal glass-pill text-white/90">--</span>
      </div>
    </div>

    <!-- Bottom Bar: Minimal Calendar & Details -->
    <div class="w-full flex flex-col md:flex-row items-end md:items-center justify-between gap-6">
      
      <!-- Quotes / Ambient Message -->
      <div class="hidden md:flex flex-col space-y-1 max-w-sm text-white/50 text-xs font-light tracking-wider">
        <p id="ambient-quote">静けさの中に、豊かな時間が流れています。</p>
        <p class="text-[10px] text-white/30" id="sun-times">日の出 --:-- / 日の入 --:--</p>
      </div>

      <!-- Mini Monthly Calendar Card -->
      <div class="glass-panel p-4 md:p-5 rounded-2xl w-full sm:w-80 pointer-events-auto transition-all hover:bg-slate-900/40">
        <div class="flex items-center justify-between mb-3 text-white/90">
          <span id="calendar-month-year" class="text-xs font-medium tracking-wider uppercase text-white/80">---- --月</span>
          <div class="flex space-x-1">
            <button onclick="changeMonth(-1)" class="p-1 hover:bg-white/10 rounded-full transition text-white/60 hover:text-white">
              <i data-lucide="chevron-left" class="w-4 h-4"></i>
            </button>
            <button onclick="changeMonth(1)" class="p-1 hover:bg-white/10 rounded-full transition text-white/60 hover:text-white">
              <i data-lucide="chevron-right" class="w-4 h-4"></i>
            </button>
          </div>
        </div>
        
        <!-- Day Names -->
        <div class="calendar-grid text-center text-[10px] font-medium text-white/40 mb-2">
          <span class="text-rose-400/80">日</span>
          <span>月</span>
          <span>火</span>
          <span>水</span>
          <span>木</span>
          <span>金</span>
          <span class="text-sky-400/80">土</span>
        </div>

        <!-- Days Container -->
        <div id="calendar-days" class="calendar-grid text-center text-xs"></div>
      </div>

    </div>

  </div>

  <!-- JavaScript Ambient Engine & Logic -->
  <script>
    // --- Application State ---
    let currentWeather = 'clear'; // 'clear', 'clouds', 'rain', 'snow', 'thunderstorm'
    let displayedDate = new Date();
    let userLocation = { name: '東京', lat: 35.6762, lon: 139.6503 };

    // --- Weather Effects Visual Engine ---
    const canvas = document.getElementById('ambient-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let animationFrameId = null;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      initParticles();
    }

    window.addEventListener('resize', resizeCanvas);

    // Particle Classes & Ambient Visuals
    class Particle {
      constructor(type) {
        this.reset(type);
      }

      reset(type) {
        this.type = type;
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;

        if (type === 'rain') {
          this.length = Math.random() * 25 + 15;
          this.speedY = Math.random() * 12 + 10;
          this.speedX = -Math.random() * 2 - 1;
          this.opacity = Math.random() * 0.4 + 0.1;
        } else if (type === 'snow') {
          this.radius = Math.random() * 3 + 1;
          this.speedY = Math.random() * 1.2 + 0.5;
          this.speedX = Math.sin(Math.random() * Math.PI) * 0.8 - 0.4;
          this.opacity = Math.random() * 0.7 + 0.2;
        } else if (type === 'clouds' || type === 'clear') {
          this.radius = Math.random() * 180 + 100;
          this.speedY = (Math.random() - 0.5) * 0.15;
          this.speedX = (Math.random() - 0.5) * 0.2;
          this.opacity = Math.random() * 0.15 + 0.05;
        }
      }

      update() {
        if (this.type === 'rain') {
          this.y += this.speedY;
          this.x += this.speedX;
          if (this.y > canvas.height) {
            this.y = -this.length;
            this.x = Math.random() * (canvas.width + 100);
          }
        } else if (this.type === 'snow') {
          this.y += this.speedY;
          this.x += Math.sin(this.y * 0.01) * 0.5;
          if (this.y > canvas.height) {
            this.y = -5;
            this.x = Math.random() * canvas.width;
          }
        } else if (this.type === 'clouds' || this.type === 'clear') {
          this.x += this.speedX;
          this.y += this.speedY;
          if (this.x < -this.radius) this.x = canvas.width + this.radius;
          if (this.x > canvas.width + this.radius) this.x = -this.radius;
          if (this.y < -this.radius) this.y = canvas.height + this.radius;
          if (this.y > canvas.height + this.radius) this.y = -this.radius;
        }
      }

      draw() {
        ctx.beginPath();
        if (this.type === 'rain') {
          ctx.strokeStyle = `rgba(180, 210, 255, ${this.opacity})`;
          ctx.lineWidth = 1.2;
          ctx.moveTo(this.x, this.y);
          ctx.lineTo(this.x + this.speedX * 2, this.y + this.length);
          ctx.stroke();
        } else if (this.type === 'snow') {
          ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          ctx.fill();
        } else if (this.type === 'clouds' || this.type === 'clear') {
          const gradient = ctx.createRadialGradient(
            this.x, this.y, 0,
            this.x, this.y, this.radius
          );
          const color = this.type === 'clear' ? '255, 200, 150' : '200, 220, 240';
          gradient.addColorStop(0, `rgba(${color}, ${this.opacity})`);
          gradient.addColorStop(1, `rgba(${color}, 0)`);
          ctx.fillStyle = gradient;
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    function initParticles() {
      particles = [];
      let count = 60;
      if (currentWeather === 'rain') count = 140;
      if (currentWeather === 'snow') count = 100;
      if (currentWeather === 'clouds') count = 15;
      if (currentWeather === 'clear') count = 10;

      for (let i = 0; i < count; i++) {
        particles.push(new Particle(currentWeather));
      }
    }

    // Lightning effect for thunderstorm
    let lightningOpacity = 0;

    function renderAmbientBackground() {
      // Background Gradient according to weather
      let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      
      switch (currentWeather) {
        case 'clear':
          grad.addColorStop(0, '#0f172a');
          grad.addColorStop(0.5, '#1e293b');
          grad.addColorStop(1, '#334155');
          break;
        case 'clouds':
          grad.addColorStop(0, '#0f172a');
          grad.addColorStop(0.6, '#1e293b');
          grad.addColorStop(1, '#273549');
          break;
        case 'rain':
          grad.addColorStop(0, '#080d1a');
          grad.addColorStop(0.7, '#0f172a');
          grad.addColorStop(1, '#1e293b');
          break;
        case 'snow':
          grad.addColorStop(0, '#0f172a');
          grad.addColorStop(0.6, '#1e293b');
          grad.addColorStop(1, '#334155');
          break;
        case 'thunderstorm':
          grad.addColorStop(0, '#030712');
          grad.addColorStop(0.7, '#0b132b');
          grad.addColorStop(1, '#1c2541');
          break;
      }

      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Render Particles
      particles.forEach(p => {
        p.update();
        p.draw();
      });

      // Lightning animation logic
      if (currentWeather === 'thunderstorm') {
        if (Math.random() < 0.005) {
          lightningOpacity = Math.random() * 0.4 + 0.2;
        }
        if (lightningOpacity > 0) {
          ctx.fillStyle = `rgba(255, 255, 255, ${lightningOpacity})`;
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          lightningOpacity -= 0.03;
        }
      }

      animationFrameId = requestAnimationFrame(renderAmbientBackground);
    }

    // --- Weather Controls & Data ---
    function setWeather(weatherType) {
      currentWeather = weatherType;
      initParticles();

      // Update Weather Badge Visuals
      const iconMap = {
        clear: { icon: 'sun', text: '晴れ', temp: '22°C' },
        clouds: { icon: 'cloud', text: '曇り', temp: '18°C' },
        rain: { icon: 'cloud-rain', text: '雨', temp: '15°C' },
        snow: { icon: 'snowflake', text: '雪', temp: '1°C' },
        thunderstorm: { icon: 'cloud-lightning', text: '雷雨', temp: '17°C' }
      };

      const info = iconMap[weatherType] || iconMap.clear;
      
      const iconWrapper = document.getElementById('weather-icon-wrapper');
      iconWrapper.innerHTML = `<i data-lucide="${info.icon}" class="w-5 h-5"></i>`;
      document.getElementById('weather-desc').textContent = info.text;
      document.getElementById('weather-temp').textContent = info.temp;
      
      // Refresh Lucide Icons
      lucide.createIcons();
    }

    // Attempt to fetch real weather from Open-Meteo API (Free, no API Key)
    async function fetchRealWeather(lat, lon, locationName = '現在地') {
      try {
        const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&daily=sunrise,sunset&timezone=auto`);
        if (!response.ok) throw new Error('Weather fetch failed');
        const data = await response.json();
        
        const weatherCode = data.current_weather.weathercode;
        const temp = Math.round(data.current_weather.temperature);
        
        // Map WMO Code to weather types
        let mappedWeather = 'clear';
        let desc = '晴れ';

        if (weatherCode === 0 || weatherCode === 1) {
          mappedWeather = 'clear';
          desc = '晴れ';
        } else if (weatherCode === 2 || weatherCode === 3) {
          mappedWeather = 'clouds';
          desc = '曇り';
        } else if ([51, 53, 55, 61, 63, 65, 80, 81, 82].includes(weatherCode)) {
          mappedWeather = 'rain';
          desc = '雨';
        } else if ([71, 73, 75, 77, 85, 86].includes(weatherCode)) {
          mappedWeather = 'snow';
          desc = '雪';
        } else if ([95, 96, 99].includes(weatherCode)) {
          mappedWeather = 'thunderstorm';
          desc = '雷雨';
        }

        document.getElementById('location-name').textContent = locationName;
        document.getElementById('weather-temp').textContent = `${temp}°C`;
        document.getElementById('weather-desc').textContent = desc;

        // Sunrise/Sunset formatting
        if (data.daily && data.daily.sunrise && data.daily.sunset) {
          const sunrise = data.daily.sunrise[0].split('T')[1];
          const sunset = data.daily.sunset[0].split('T')[1];
          document.getElementById('sun-times').textContent = `日の出 ${sunrise} / 日の入 ${sunset}`;
        }

        setWeather(mappedWeather);
      } catch (err) {
        console.warn('Real weather API unavailable, fallback to preset.', err);
      }
    }

    function fetchCurrentLocationWeather() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            fetchRealWeather(pos.coords.latitude, pos.coords.longitude, '現在地');
          },
          () => {
            fetchRealWeather(userLocation.lat, userLocation.lon, userLocation.name);
          }
        );
      } else {
        fetchRealWeather(userLocation.lat, userLocation.lon, userLocation.name);
      }
    }

    // --- Clock Engine ---
    function updateClock() {
      const now = new Date();
      
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');

      document.getElementById('clock-time').childNodes[0].nodeValue = `${hours}:${minutes}`;
      document.getElementById('clock-seconds').textContent = seconds;

      // Update Date Header
      const year = now.getFullYear();
      const month = now.getMonth() + 1;
      const date = now.getDate();
      const dayNames = ['日曜日', '月曜日', '火曜日', '水曜日', '木曜日', '金曜日', '土曜日'];
      const dayName = dayNames[now.getDay()];

      document.getElementById('date-full').textContent = `${year}年${month}月${date}日`;
      document.getElementById('date-day').textContent = dayName;
    }

    // --- Mini Calendar Engine ---
    function renderCalendar() {
      const container = document.getElementById('calendar-days');
      container.innerHTML = '';

      const year = displayedDate.getFullYear();
      const month = displayedDate.getMonth();

      document.getElementById('calendar-month-year').textContent = `${year}年 ${month + 1}月`;

      const firstDay = new Date(year, month, 1).getDay();
      const lastDate = new Date(year, month + 1, 0).getDate();
      const today = new Date();

      // Padding previous month days
      for (let i = 0; i < firstDay; i++) {
        const emptyCell = document.createElement('span');
        emptyCell.className = 'text-white/10 py-1';
        container.appendChild(emptyCell);
      }

      // Days of current month
      for (let day = 1; day <= lastDate; day++) {
        const dayCell = document.createElement('div');
        const isToday = today.getFullYear() === year && today.getMonth() === month && today.getDate() === day;
        
        dayCell.className = `py-1 rounded-full flex items-center justify-center cursor-default transition-all ${
          isToday 
            ? 'bg-white text-slate-900 font-bold shadow-md scale-105' 
            : 'text-white/80 hover:bg-white/10'
        }`;
        
        dayCell.textContent = day;
        container.appendChild(dayCell);
      }
    }

    function changeMonth(delta) {
      displayedDate.setMonth(displayedDate.getMonth() + delta);
      renderCalendar();
    }

    // --- Fullscreen Handler ---
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          console.warn(`Fullscreen error: ${err.message}`);
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    // --- Quotes Cycle ---
    const quotes = [
      "静けさの中に、豊かな時間が流れています。",
      "一歩ずつ、静かに前へ進もう。",
      "今日という日を大切に整える。",
      "心地よい空間と、落ち着いた時間。"
    ];
    let quoteIndex = 0;
    setInterval(() => {
      quoteIndex = (quoteIndex + 1) % quotes.length;
      const el = document.getElementById('ambient-quote');
      if (el) el.textContent = quotes[quoteIndex];
    }, 120000);

    // --- Initialize Everything ---
    window.onload = function () {
      lucide.createIcons();
      resizeCanvas();
      renderAmbientBackground();
      
      updateClock();
      setInterval(updateClock, 1000);
      
      renderCalendar();

      // Initial Weather Fetch
      fetchRealWeather(userLocation.lat, userLocation.lon, userLocation.name);
    };
  </script>
</body>
</html>
